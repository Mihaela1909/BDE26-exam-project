<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>do it with Mi</title>
  </head>
  <body>
    <div class="decor" id="decor" aria-hidden="true"></div>

    <main class="app">
      <header class="app-header">
        <h1 class="brand">
          <span class="brand-text">do it<br />with</span>
          <img class="brand-logo" src="/logo.svg" alt="Mi" />
          <span class="brand-tagline">your everyday<br />assistant</span>
        </h1>
      </header>

      <div class="app-body">
        <section class="top-row">
          <div class="date-picker panel">
            <div class="date-picker-header">
              <span id="date-label">Today is:</span>
              <button type="button" id="clear-date" aria-label="Remove due date" hidden>✕</button>
              <button type="button" id="calendar-button" class="icon-button" aria-label="Open calendar">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M8.5 13.5l2.5 2.5 4.5-4.5"/></svg>
              </button>
              <input type="date" id="due-date-input" tabindex="-1" aria-hidden="true" />
            </div>
            <div class="date-row">
              <div class="month-tile" aria-hidden="true">
                <span class="month-year" id="month-year"></span>
                <span class="month-name" id="month-name"></span>
              </div>
              <div class="week-strip" id="week-strip"></div>
            </div>
          </div>

          <div class="controls">
            <div class="settings-row">
              <div class="background-picker" role="group" aria-labelledby="background-label">
                <span id="background-label">Background color:</span>
                <div class="swatches">
                  <button type="button" class="swatch swatch-default" id="reset-background" data-color="" aria-label="Original background" title="Original background"></button>
                  <button type="button" class="swatch" data-color="#6aaaf5" style="--swatch: #6aaaf5" aria-label="Blue background"></button>
                  <button type="button" class="swatch" data-color="#e39b4f" style="--swatch: #e39b4f" aria-label="Orange background"></button>
                  <button type="button" class="swatch" data-color="#8ace41" style="--swatch: #8ace41" aria-label="Green background"></button>
                  <label class="swatch swatch-custom" id="custom-swatch" title="Pick any color">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 5.5l4 4M17 3a2.8 2.8 0 0 1 4 4l-2 2-4-4 2-2zM15 7l-9.5 9.5L4 20l3.5-1.5L17 9"/></svg>
                    <input type="color" id="colorPicker" value="#b5e6fb" aria-label="Custom background color" />
                  </label>
                </div>
              </div>

              <div class="theme-switch">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <button type="button" id="theme-toggle" class="switch" aria-label="Switch to dark mode" aria-pressed="false">
                  <span class="switch-knob"></span>
                </button>
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
              </div>
            </div>

            <form class="todo-form">
              <input type="text" placeholder="What’s today’s agenda?" id="todo-input" aria-label="New todo" />
              <button type="submit" class="add-button">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Add
              </button>
            </form>
            <div class="error-slot">
              <p id="error-message" role="alert" hidden></p>
            </div>
          </div>
        </section>

        <section class="progress">
          <div class="progress-header">
            <h2 id="progress-heading">Your progress:</h2>
            <p class="progress-text" id="progress-text">0 of 0 · 0%</p>
          </div>
          <div class="progress-bar" id="progress-bar" role="progressbar" aria-labelledby="progress-heading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
        </section>

        <div class="filters" id="filters">
          <span class="filter-indicator" id="filter-indicator" aria-hidden="true" hidden></span>
          <button type="button" class="filter-button" data-filter="all">All <span class="filter-count">(0)</span></button>
          <button type="button" class="filter-button" data-filter="active">Active <span class="filter-count">(0)</span></button>
          <button type="button" class="filter-button" data-filter="completed">Completed <span class="filter-count">(0)</span></button>
        </div>

        <ul class="todo-list" id="todo-list"></ul>

        <div class="empty-state panel" id="empty-state" hidden>
          <img src="/flower.svg" alt="" width="72" height="54" />
          <p class="empty-title" id="empty-title"></p>
          <p class="empty-text" id="empty-text"></p>
        </div>

        <footer class="app-footer">
          <p id="tasks-left">0 Tasks left to do</p>
          <div class="footer-actions">
            <button type="button" id="clear-completed" class="pill-button">Clear completed</button>
            <button type="button" id="clear-all" class="pill-button">
              Clear all
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
            </button>
          </div>
        </footer>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
