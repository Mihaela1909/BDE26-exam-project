<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>todoclass</title>
  </head>
  <body>
    <div id="app"></div>
<div class="container">
  <h1>My Todo List</h1>

<div class="date-picker">
  <div class="date-picker-header">
    <span id="date-label">Today is:</span>
    <button type="button" id="clear-date" aria-label="Remove due date" hidden>✕</button>
    <button type="button" id="calendar-button" aria-label="Open calendar">📅</button>
    <input type="date" id="due-date-input" tabindex="-1" aria-hidden="true" />
  </div>
  <div class="week-strip" id="week-strip"></div>
</div>

  <form class="todo-form">
    <input type="text" placeholder="Add a new todo..." id="todo-input"/>   
<button type="submit">Add</button>
  </form>
  <p id="error-message">Please enter a todo item.</p>

<div class="progress">
  <div class="progress-bar" id="progress-bar" role="progressbar" aria-label="Completed todos" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <p class="progress-text" id="progress-text">0 of 0 done · 0%</p>
</div>

<div class="filters">
  <button type="button" class="filter-button" data-filter="all">All</button>
  <button type="button" class="filter-button" data-filter="active">Active</button>
  <button type="button" class="filter-button" data-filter="completed">Completed</button>
</div>

<ul class="todo-list" id="todo-list">

</ul>

<button type="button" id="clear-completed">Clear completed</button>

<input type="color" id="colorPicker" />

</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
